<nav
  id="primary-navigation"
  class="doe-primary-nav"
  [class.doe-primary-nav--suppress-hover]="suppressHoverSubmenus()"
  aria-label="Primary navigation"
  tabindex="-1"
  (pointermove)="allowHoverSubmenus($event)"
>
  <div class="doe-primary-nav__container">
    <div class="doe-primary-nav__mobile-bar">
      <button
        type="button"
        class="doe-primary-nav__toggle"
        [class.doe-primary-nav__toggle--open]="isMenuOpen()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="primary-navigation-list"
        aria-label="Toggle navigation menu"
        (click)="toggleMenu()"
      >
        <span class="doe-primary-nav__toggle-label">Menu</span>
        <span class="doe-primary-nav__toggle-icon" aria-hidden="true">
          <span></span>
        </span>
      </button>
    </div>

    <ul
      id="primary-navigation-list"
      class="doe-primary-nav__list"
      role="menubar"
      [class.doe-primary-nav__list--open]="isMenuOpen()"
    >
      @for (item of navItems; track item.path) {
        <li
          class="doe-primary-nav__item"
          [class.doe-primary-nav__item--has-menu]="hasChildren(item)"
          role="none"
          routerLinkActive="doe-primary-nav__item--active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        >
          @if (hasChildren(item)) {
            <div class="doe-primary-nav__item-row">
              <a
                [routerLink]="item.path"
                routerLinkActive="doe-primary-nav__link--active"
                ariaCurrentWhenActive="location"
                class="doe-primary-nav__link"
                role="menuitem"
                (click)="closeMenu($event)"
              >
                @if (item.icon) {
                  <i [class]="item.icon" class="doe-primary-nav__home-icon" aria-hidden="true"></i>
                }
                <span [class.doe-primary-nav__home-text]="item.path === '/'">{{ item.label }}</span>
              </a>
              <button
                type="button"
                class="doe-primary-nav__submenu-toggle"
                [class.doe-primary-nav__submenu-toggle--open]="openSubmenu() === itemKey(item)"
                [attr.aria-expanded]="openSubmenu() === itemKey(item)"
                [attr.aria-controls]="itemKey(item) + '-submenu'"
                aria-haspopup="true"
                [attr.aria-label]="'Toggle ' + item.label + ' submenu'"
                tabindex="-1"
                role="menuitem"
                (click)="toggleSubmenu(itemKey(item))"
              >
                <span aria-hidden="true"></span>
              </button>
            </div>
            <ul
              [id]="itemKey(item) + '-submenu'"
              class="doe-primary-nav__submenu"
              [class.doe-primary-nav__submenu--open]="openSubmenu() === itemKey(item)"
              [attr.aria-label]="item.label"
              role="menu"
            >
              @for (child of item.children; track child.path) {
                <li role="none">
                  <a [routerLink]="child.path" role="menuitem" (click)="closeMenu($event)">{{ child.label }}</a>
                </li>
              }
            </ul>
          } @else {
            <a
              [routerLink]="item.path"
              routerLinkActive="doe-primary-nav__link--active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
              class="doe-primary-nav__link"
              role="menuitem"
              (click)="closeMenu($event)"
            >
              @if (item.icon) {
                <i [class]="item.icon" class="doe-primary-nav__home-icon" aria-hidden="true"></i>
              }
              <span [class.doe-primary-nav__home-text]="item.path === '/'">{{ item.label }}</span>
            </a>
          }
        </li>
      }

      <li class="doe-primary-nav__item doe-primary-nav__item--asset-toggle" role="none">
        <button
          type="button"
          class="doe-primary-nav__asset-toggle"
          role="switch"
          [attr.aria-checked]="domainAssetMode.mode() === 'dark-blue'"
          [attr.aria-label]="domainAssetMode.mode() === 'dark-blue' ? 'Use colour domain icons' : 'Use dark blue domain icons'"
          [attr.title]="domainAssetMode.mode() === 'dark-blue' ? 'Use colour domain icons' : 'Use dark blue domain icons'"
          (click)="toggleDomainAssetMode()"
        >
          <span class="doe-primary-nav__asset-toggle-track" aria-hidden="true">
            <span class="doe-primary-nav__asset-toggle-thumb"></span>
          </span>
        </button>
      </li>
    </ul>
  </div>
</nav>
