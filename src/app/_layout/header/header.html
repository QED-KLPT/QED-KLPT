<header class="doe-header" role="banner">
  <div class="doe-header__pre">
    <div class="doe-header__container doe-header__pre-inner">
      <nav class="doe-header__site-tools" aria-label="Site tools">
        <ul class="doe-header__site-tools-list">
          <li>
            <a href="https://qed.qld.gov.au/"><i aria-hidden=true class="fa-solid fa-globe"></i>&nbsp;QLD Education website</a>
          </li>
          <li>
            <a href="https://qed.qld.gov.au/contact-us"><i aria-hidden=true class="fa fa-phone"></i>&nbsp;Contact us</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <div class="doe-header__masthead">
    <div class="doe-header__container doe-header__masthead-inner">
      <div class="doe-header__brand">
        <a class="doe-header__brand-mark" routerLink="/" aria-label="Department of Education">
          <img src="assets/img/queensland-coat-of-arms.svg" alt="" />
        </a>
        <a class="doe-header__brand-title" routerLink="/">Kindergarten Learning Progression Toolkit</a>
      </div>

      <!-- <form class="doe-header__search" role="search" aria-label="Site search">
        <label class="doe-header__search-label" for="site-search">Search</label>
        <input id="site-search" name="search" type="search" placeholder="Search" />
        <button type="submit" aria-label="Submit search">Search</button>
      </form> -->
    </div>
  </div>

  <app-nav />

  @if (showDraftContentDisclaimer) {
    <app-global-alert type="general" [dismissible]="false">
      <strong>Draft content:</strong> This site contains draft and placeholder content. It should not be treated as final or official content.
    </app-global-alert>
  }
</header>
