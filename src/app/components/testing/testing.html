<section class="section section--white">
  <div class="section__inner">
    <h2>Testing Hub</h2>
    <p>Navigate to individual component testing pages below.</p>
    <div class="testing-video">
      @if (showTestVideo()) {
        <app-vid-player
          videoId="sample-vid-smash-cake"
          title="Example number one - Smash cake sample video"
        />
      }
      @if (showTestVideo()) {
        <app-vid-player
          videoId="sample-vid-kerry"
          title="Example number two - Kerry sample video"
        />
      }
      <app-plyr-player
        title="Observational data and the planning cycle"
        youtubeUrl="https://www.youtube.com/watch?v=RCmiHUNHa8c"
      />
      <button
        class="testing-video__clear"
        type="button"
        (click)="clearVideoAccess()"
      >
        Clear video access
      </button>
      @if (accessTimeRemaining()) {
        <p
          class="testing-video__countdown"
          role="timer"
          aria-label="Video access time remaining"
        >
          Video access expires in
          <strong>{{ accessTimeRemaining() }}</strong>.
        </p>
      }
      @if (videoAccessCleared()) {
        <p class="testing-video__confirmation" role="status">
          Video access token cleared. The passkey is required again.
        </p>
      }
    </div>   
  </div>
</section>
