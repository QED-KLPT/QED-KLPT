<div class="youtube-player">
  <!-- API-based player (subtitles disabled) -->
  <div *ngIf="!subtitles && youtubeUrl" class="video-container yt-api-player"></div>

  <!-- Simple iframe player (subtitles enabled) -->
  <div *ngIf="sanitizedUrl" class="video-container">
    <iframe 
      [src]="sanitizedUrl"
      width="560" 
      height="315" 
      [attr.title]="title || 'YouTube video player'"
      frameborder="0" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>
  </div>

  <div *ngIf="title || description" class="content">
        <h3 *ngIf="title" class="video-title">{{ title }}</h3>
    <p *ngIf="description" class="video-description">{{ description }}</p>
  </div>

  <div *ngIf="!sanitizedUrl && subtitles" class="no-video">
    <p>No valid YouTube URL provided</p>
  </div>

  <div class="transcript-section" *ngIf="transcript">
    <div
      id="transcript-content-{{title}}"
      class="transcript-content"
    >
      <p *ngFor="let line of transcriptLines">{{ line }}</p>
    </div>
  </div>

</div>
