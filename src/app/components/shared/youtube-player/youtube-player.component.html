<div class="youtube-player">
  <div *ngIf="sanitizedUrl" class="video-container">
    <iframe 
      [src]="sanitizedUrl"
      width="560" 
      height="315" 
      [attr.title]="title || 'YouTube video player'"
      frameborder="0" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>
  </div>

  <div *ngIf="title || description" class="content">
        <h2 *ngIf="title" class="video-title">{{ title }}</h2>
    <p *ngIf="description" class="video-description">{{ description }}</p>
  </div>

  <div *ngIf="!sanitizedUrl" class="no-video">
    <p>No valid YouTube URL provided</p>
  </div>

  <div class="transcript-section" *ngIf="transcript">
    <button
      type="button"
      (click)="toggleTranscript()"
      class="transcript-toggle"
      [class.transcript-toggle--open]="showTranscript"
      [attr.aria-expanded]="showTranscript"
      aria-controls="transcript-content-{{title}}"
    >
      <span class="transcript-toggle__icon" aria-hidden="true"></span>
      {{ showTranscript ? 'Hide Transcript' : 'View Transcript' }}
    </button>
    <div
      id="transcript-content-{{title}}"
      class="transcript-content"
      [class.transcript-content--scrollable]="needsScrollbar"
      #transcriptEl
      *ngIf="showTranscript"
    >
      <p *ngFor="let line of transcriptLines">{{ line }}</p>
    </div>
  </div>

</div>
