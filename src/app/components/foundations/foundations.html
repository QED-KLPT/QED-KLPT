<section class="section section--cream page-placeholder top-level-hero">
  <div class="section__inner">
    <app-breadcrumb class="domain-hero__breadcrumbs" [items]="breadcrumbs" />

    <h1>KLPT foundations</h1>
    <p>     
      The KLPT foundations help teachers and educators to use the KLPT effectively by providing support and resources on quality observations, analysis and planning.  
    </p>    
  </div>
</section>
<section class="section section--white foundation-nav">
  <div class="section__inner">
    <div class="foundation-nav__grid">
      @for (foundation of themedFoundations(); track foundation.title) {
        <app-domain-card
          [title]="foundation.title"
          [description]="foundation.description"
          [url]="foundation.url"
          [background]="foundation.background"
          [hoverBorderColor]="foundation.hoverBorderColor"
          [textColor]="foundation.textColor"
          [imageSrc]="foundation.imageSrc"
          [imageAlt]="foundation.imageAlt"
        />
      }
    </div>
  </div>
</section>
