<section class="section section--white klpt-step">
  <div class="section__inner">
    <p class="eyebrow">Step 2</p>
    <h2>Create session</h2>
    <p>Use a temporary session tag and enter the observer's name.</p>

    <div class="qld__form-group qld__form-group--aligned">
      <span class="qld__label qld__form-group__label">Learner code</span>
      <div class="qld__form-group__input-area">
        <div class="session-tag-generator" aria-live="polite">
          <span class="session-tag-badge">
            <svg class="session-tag-shape" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              @switch (currentSessionTag.shapeId) {
                @case ('square') {
                  <rect x="5" y="5" width="14" height="14" rx="2" [attr.fill]="currentSessionTag.colourHex"></rect>
                }
                @case ('triangle') {
                  <polygon points="12,4 21,20 3,20" [attr.fill]="currentSessionTag.colourHex"></polygon>
                }
                @case ('diamond') {
                  <polygon points="12,3 21,12 12,21 3,12" [attr.fill]="currentSessionTag.colourHex"></polygon>
                }
                @case ('hexagon') {
                  <polygon points="7,3 17,3 22,12 17,21 7,21 2,12" [attr.fill]="currentSessionTag.colourHex"></polygon>
                }
                @default {
                  <circle cx="12" cy="12" r="8.5" [attr.fill]="currentSessionTag.colourHex"></circle>
                }
              }
            </svg>
            <strong>{{ currentSessionTag.label }}</strong>
          </span>
          <button type="button" class="session-tag-regenerate" (click)="onRegenerateSessionTag()">
            Regenerate
          </button>
        </div>
      </div>
    </div>

    <div class="qld__form-group qld__form-group--aligned">
      <label for="educator-name" class="qld__label qld__form-group__label">Observer's name</label>
      <div class="qld__form-group__input-area">
        @if (educatorNameError) {
          <span class="qld__input--error" id="educator-name-error" role="alert">
            <svg class="qld__icon qld__icon--lead qld__icon--sm" role="img" aria-label="Error: ">
              <use href="./?a=169317:dist/mysource_files/img/QLD-icons.svg#status-error"></use>
            </svg>
            Please enter the observer's name
          </span>
        }
        <input
          type="text"
          id="educator-name"
          class="qld__text-input"
          [class.qld__text-input--error]="educatorNameError"
          [attr.aria-invalid]="educatorNameError ? 'true' : null"
          [attr.aria-describedby]="educatorNameError ? 'educator-name-error' : null"
          placeholder="Enter observer's name"
          [value]="educatorName"
          (input)="onEducatorNameInput($event)"
        />
      </div>
    </div>

    <div class="klpt-step__actions">
      <a class="button button--secondary" routerLink="/klpt/list-sessions">Back</a>
      <button type="button" class="button button--primary" (click)="onNext()">Next</button>
    </div>
  </div>
</section>
