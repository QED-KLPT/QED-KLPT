name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - dev
      - test
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            return await core.getIDToken()
          result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_MOSS_02A151300 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist/qed-klpt/browser"
          app_build_command: ${{ github.ref == 'refs/heads/main' && 'npm run build -- --configuration production' || 'npm run build -- --configuration development' }}
          production_branch: "main"
          github_id_token: ${{ steps.idtoken.outputs.result }}
